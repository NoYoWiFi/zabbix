server {
 	listen 8080;
	listen 8443 ssl;
 	ssl_certificate "/etc/pki/nginx/server.pem";
        	ssl_certificate_key "/etc/pki/nginx/server.pem";
        	ssl_session_cache shared:SSL:1m;
        	ssl_session_timeout  10m;
        #	ssl_ciphers PROFILE=SYSTEM;
        	ssl_prefer_server_ciphers on;
        	if ($server_port = 8080) {
        		rewrite ^(/.*)$ https://$host:8443$1 permanent;
        	}
#        server_name     example.com;

        root    /usr/share/zabbix;

        index   index.php index.html index.htm;

        location = /favicon.ico {
                log_not_found   off;
        }

        location = /cgs/ {
                try_files $uri $uri/ =406;
                alias /usr/share/zabbix/cgs/;     
        }

		# 察数系统静态文件
		location /monitor/ {
			alias /usr/share/zabbix/monitor/;
			try_files $uri $uri/ /monitor/index.html;
			# 静态资源缓存
			location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
				expires 30d;
				add_header Cache-Control "public, immutable";
				access_log off;
			}
		}

		location /monitor/static/ {
				alias /usr/share/zabbix/monitor/backend/static/;
				expires 7d;
				add_header Cache-Control "public, immutable";
		}
    
		#  察数系统 API 代理 - 关键配置
		location /monitor/api/ {
			# 去除 /monitor 前缀，转发到后端
			proxy_pass http://127.0.0.1:8000/api/;
			# 注意：proxy_pass 末尾的 / 很重要，会去掉匹配的前缀
			
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			
			# 超时设置（数据导入需要较长时间）
			proxy_connect_timeout 300s;
			proxy_send_timeout 300s;
			proxy_read_timeout 300s;
			
			# 大文件支持
			client_max_body_size 100M;
			
			# 禁用缓冲（实时日志需要）
			proxy_buffering off;
			proxy_cache off;
		}

		# 察数系统静态文件
		location /development/ {
			alias /usr/share/zabbix/development/;
			try_files $uri $uri/ /development/index.html;
			# 静态资源缓存
			location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
				expires 30d;
				add_header Cache-Control "public, immutable";
				access_log off;
			}
		}

		location /development/static/ {
			alias /usr/share/zabbix/development/backend/static/;
			expires 7d;
			add_header Cache-Control "public, immutable";
		}
		
		#  察数系统 API 代理 - 关键配置
		location /development/api/ {
			# 去除 /development 前缀，转发到后端
			proxy_pass http://127.0.0.1:8800/api/;
			# 注意：proxy_pass 末尾的 / 很重要，会去掉匹配的前缀
			
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			
			# 超时设置（数据导入需要较长时间）
			proxy_connect_timeout 300s;
			proxy_send_timeout 300s;
			proxy_read_timeout 300s;
			
			# 大文件支持
			client_max_body_size 100M;
			
			# 禁用缓冲（实时日志需要）
			proxy_buffering off;
			proxy_cache off;
		}

        location / {
                try_files $uri $uri/ =404;
                alias /usr/share/zabbix/;               
        }
        location /assets {
                access_log      off;
                expires         10d;
        }

        location ~ /\.ht {
                deny            all;
        }

#        location ~ /(api\/|conf[^\.]|include|locale) {
#                deny            all;
#                return          404;
#        }

        location /vendor {
                deny            all;
                return          404;
        }

        location ~ [^/]\.php(/|$) {
                fastcgi_pass    unix:/run/php-fpm/zabbix.sock;
                fastcgi_split_path_info ^(.+\.php)(/.+)$;
                fastcgi_index   index.php;

                fastcgi_param   DOCUMENT_ROOT   /usr/share/zabbix;
                fastcgi_param   SCRIPT_FILENAME /usr/share/zabbix$fastcgi_script_name;
                fastcgi_param   PATH_TRANSLATED /usr/share/zabbix$fastcgi_script_name;

                include fastcgi_params;
                fastcgi_param   QUERY_STRING    $query_string;
                fastcgi_param   REQUEST_METHOD  $request_method;
                fastcgi_param   CONTENT_TYPE    $content_type;
                fastcgi_param   CONTENT_LENGTH  $content_length;

                fastcgi_intercept_errors        on;
                fastcgi_ignore_client_abort     off;
                fastcgi_connect_timeout         60;
                fastcgi_send_timeout            180;
                fastcgi_read_timeout            180;
                fastcgi_buffer_size             128k;
                fastcgi_buffers                 4 256k;
                fastcgi_busy_buffers_size       256k;
                fastcgi_temp_file_write_size    256k;
        }
}
