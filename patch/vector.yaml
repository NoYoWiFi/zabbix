# -------------------------------------------
# 3. Sinks：定义数据输出目标
# -------------------------------------------

sinks:
  # 输出到 ClickHouse (你的日志存储)
  clickhouse_sink:
    type: "clickhouse"
    inputs: ["parse_all"]  # 接收所有解析后的数据
    host: "http://localhost:8123"            # ClickHouse HTTP 接口
    database: "default"
    table: "{{ ._table }}"                   # 你创建的表名，动态表名
    auth:
      strategy: basic
      user: "zabbix"
      password: "Admin@zabbix.com"
    dangerously_allow_unconfined_template_resolution: true
    compression: "gzip"
    batch:
      max_events: 10000                      # 每 1 万条批量写入
      timeout_secs: 5                        # 或每 5 秒写入一次
    buffer:
      type: "disk"                           # 使用磁盘缓冲区，防止数据丢失
      max_size: 21474836480                    # 约 20 GB
      when_full: "block"                     # 缓冲满时阻塞上游
    request:
      concurrency: 10
      retry_max_duration_secs: 900

#  可选：输出到控制台 (用于调试)
