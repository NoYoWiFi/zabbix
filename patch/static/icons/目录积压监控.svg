<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="folderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F8C471"/>
      <stop offset="100%" style="stop-color:#E59866"/>
    </linearGradient>
    <linearGradient id="diskTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E8ECEF"/>
      <stop offset="100%" style="stop-color:#C5CBD3"/>
    </linearGradient>
    <linearGradient id="diskSide" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#B0B8C4"/>
      <stop offset="100%" style="stop-color:#8E9AAB"/>
    </linearGradient>
    <linearGradient id="diskPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5DADE2"/>
      <stop offset="100%" style="stop-color:#2E86C1"/>
    </linearGradient>
  </defs>

  <!-- 地面投影 -->
  <ellipse cx="16" cy="28" rx="14" ry="3" fill="#000" opacity="0.08"/>

  <!-- ===== 文件夹主体 ===== -->
  <!-- 背面厚度 -->
  <rect x="4" y="14" width="22" height="14" rx="1.5" fill="#D35400"/>
  <rect x="4" y="14" width="22" height="14" rx="1.5" fill="#E59866" stroke="#C0392B" stroke-width="0.5"/>
  
  <!-- 正面 -->
  <rect x="4" y="11" width="22" height="14" rx="1.5" fill="url(#folderGrad)" stroke="#C0392B" stroke-width="0.5"/>
  
  <!-- 文件夹折角 -->
  <polyline points="4,11 14,11 16,13 26,13 26,25" fill="none" stroke="#C0392B" stroke-width="0.5"/>
  <polygon points="14,11 14,13 16,13" fill="#F5CBA7"/>
  
  <!-- 文件夹标签 -->
  <rect x="8" y="13" width="6" height="1.5" rx="0.3" fill="#C0392B" opacity="0.3"/>

  <!-- ===== 右上角：摞起来的3D磁盘（3层） ===== -->

  <!-- 第1层（底层，最宽，部分被上层挡住） -->
  <ellipse cx="24" cy="16" rx="9" ry="3.2" fill="#8E9AAB"/>
  <ellipse cx="24" cy="14.5" rx="9" ry="3.2" fill="url(#diskSide)" stroke="#7F8C9A" stroke-width="0.4"/>
  <ellipse cx="24" cy="13.5" rx="8" ry="2.8" fill="url(#diskTop)" stroke="#A8B0BC" stroke-width="0.4"/>
  <ellipse cx="24" cy="13.5" rx="4" ry="1.4" fill="url(#diskPlate)" opacity="0.2"/>

  <!-- 第2层（中间层） -->
  <ellipse cx="24" cy="12.5" rx="9" ry="3.2" fill="#8E9AAB"/>
  <ellipse cx="24" cy="11" rx="9" ry="3.2" fill="url(#diskSide)" stroke="#7F8C9A" stroke-width="0.4"/>
  <ellipse cx="24" cy="10" rx="8" ry="2.8" fill="url(#diskTop)" stroke="#A8B0BC" stroke-width="0.4"/>
  <ellipse cx="24" cy="10" rx="4" ry="1.4" fill="url(#diskPlate)" opacity="0.3"/>
  <ellipse cx="24" cy="10" rx="2.5" ry="0.9" fill="none" stroke="#2E86C1" stroke-width="0.4" opacity="0.2"/>

  <!-- 第3层（顶层，完整可见） -->
  <ellipse cx="24" cy="8" rx="9" ry="3.2" fill="#8E9AAB"/>
  <ellipse cx="24" cy="6.5" rx="9" ry="3.2" fill="url(#diskSide)" stroke="#7F8C9A" stroke-width="0.4"/>
  <ellipse cx="24" cy="5.5" rx="8" ry="2.8" fill="url(#diskTop)" stroke="#A8B0BC" stroke-width="0.4"/>
  
  <!-- 顶层盘片（最亮） -->
  <ellipse cx="24" cy="5.5" rx="4" ry="1.4" fill="url(#diskPlate)" opacity="0.5"/>
  <ellipse cx="24" cy="5.5" rx="2.5" ry="0.9" fill="none" stroke="#2E86C1" stroke-width="0.4" opacity="0.3"/>
  <circle cx="24" cy="5.5" r="1" fill="none" stroke="#2E86C1" stroke-width="0.4" opacity="0.3"/>
  
  <!-- 顶层磁头臂 -->
  <line x1="24" y1="5.5" x2="27" y2="3.8" stroke="#F1C40F" stroke-width="1.3" stroke-linecap="round"/>
  <circle cx="27" cy="3.8" r="1.2" fill="#F1C40F"/>

  <!-- ===== 文件夹高光 ===== -->
  <rect x="4" y="11" width="22" height="2" rx="1" fill="white" opacity="0.12"/>
</svg>